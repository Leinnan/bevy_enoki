[package]
name = "example"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = {version = "0.16.0", features = [
	"file_watcher", "trace_tracy", "trace_tracy_memory"
]}
tracy-client-sys = {version = "0.24.3"}
bevy_enoki = { path = "../crates/enoki2d", features = ["trace"] }
rand = "0.8.5"

[[bin]]
name = "sprites"
path = "src/sprites.rs"

[[bin]]
name = "atlas"
path = "src/atlas.rs"

[[bin]]
name = "dynamic"
path = "src/dynamic.rs"

[[bin]]
name = "material"
path = "src/material.rs"
